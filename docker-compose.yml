services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: luxgems
      POSTGRES_USER: luxgems
      POSTGRES_PASSWORD: luxgems
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxgems -d luxgems"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn luxgems.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://luxgems:luxgems@db:5432/luxgems
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,0.0.0.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
