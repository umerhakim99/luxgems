{% extends "base.html" %}
{% block title %}Login | Lux Gems{% endblock %}
{% block content %}
<section class="lx-section" style="max-width:480px;">
  <h1 class="lx-section-title">Welcome back</h1>
  <form method="post" class="lx-form-stack">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <ul class="lx-messages">{% for e in form.non_field_errors %}<li class="lx-msg-error">{{ e }}</li>{% endfor %}</ul>
    {% endif %}
    <label>Email {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button type="submit" class="lx-btn lx-btn-primary">Login</button>
  </form>
  <p class="lx-meta" style="margin-top:1.5rem;">
    <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
    ·
    <a href="{% url 'accounts:register' %}">Create an account</a>
  </p>
</section>
{% endblock %}
