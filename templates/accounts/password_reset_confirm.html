{% extends "base.html" %}
{% block title %}Choose new password | Lux Gems{% endblock %}
{% block content %}
<section class="lx-section" style="max-width:480px;">
  <h1 class="lx-section-title">New password</h1>
  {% if validlink %}
    <form method="post" class="lx-form-stack">
      {% csrf_token %}
      {% for field in form %}
        <label>{{ field.label }}{{ field.errors }}{{ field }}</label>
      {% endfor %}
      <button type="submit" class="lx-btn lx-btn-primary">Update password</button>
    </form>
  {% else %}
    <p class="lx-msg-error">This reset link is invalid or has expired.</p>
    <a class="lx-btn lx-btn-ghost" href="{% url 'accounts:password_reset' %}">Request a new link</a>
  {% endif %}
</section>
{% endblock %}
