{% extends "base.html" %}
{% block title %}Reset password | Lux Gems{% endblock %}
{% block content %}
<section class="lx-section" style="max-width:480px;">
  <h1 class="lx-section-title">Reset password</h1>
  <p class="lx-meta">Enter your account email and we will send you a reset link.</p>
  <form method="post" class="lx-form-stack" style="margin-top:1.5rem;">
    {% csrf_token %}
    {{ form.email.errors }}
    <label>Email {{ form.email }}</label>
    <button type="submit" class="lx-btn lx-btn-primary">Send link</button>
  </form>
</section>
{% endblock %}
